security:
    encoders:
        App\Entity\User:
            algorithm: bcrypt

    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|scss|images|js)/
            security: false
        main:
            anonymous: lazy
            provider: app_user_provider
            guard:
                authenticators:
                    - App\Security\UserAuthenticator
            form_login:
                login_path: app_login
                check_path: app_login
                csrf_token_generator: security.csrf.token_manager
            logout:
                path: app_logout
                target: /
                # where to redirect after logout
                # target: app_any_route
            remember_me:
              always_remember_me: true
              secret: '%kernel.secret%'
              lifetime: 2419200 # 2419200 - 1 month in seconds | 604800 - 1 week in seconds
              path: /

          # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#firewalls-authentication

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    role_hierarchy:
        ROLE_MODERATOR: ROLE_USER
        ROLE_SUPER_MODERATOR: ROLE_MODERATOR

        ROLE_ARTICLE_COMMENT_REMOVER: ROLE_MODERATOR
        ROLE_ARTICLE_EDITOR: ROLE_MODERATOR
        ROLE_ARTICLE_AUTHOR: ROLE_MODERATOR
        ROLE_ARTICLE_APPROVER: ROLE_MODERATOR

        ROLE_VOCALIST_EDITOR: ROLE_MODERATOR

        ROLE_SONG_COMMENT_REMOVER: ROLE_MODERATOR
        ROLE_SONG_EDITOR: ROLE_MODERATOR

        ROLE_USER_ANALYST: ROLE_MODERATOR
        ROLE_USER_ACTIONS: ROLE_MODERATOR
        ROLE_USER_BLOCKER: ROLE_MODERATOR

        ROLE_USER_MANAGER: [ROLE_MODERATOR, ROLE_SUPER_MODERATOR]
        ROLE_ADMINISTRATOR: ROLE_USER_MANAGER

        ROLE_OWNER: [ROLE_ADMINISTRATOR, ROLE_ARTICLE_COMMENT_REMOVER, ROLE_ARTICLE_EDITOR, ROLE_ARTICLE_AUTHOR, ROLE_ARTICLE_APPROVER, ROLE_VOCALIST_EDITOR, ROLE_SONG_COMMENT_REMOVER, ROLE_SONG_EDITOR, ROLE_USER_ANALYST, ROLE_USER_ACTIONS, ROLE_USER_BLOCKER]

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # Administrator
         - { path: ^/dashboard, roles: ROLE_OWNER }

        # User blocker
         - { path: ^/blockingUser, roles: ROLE_USER_BLOCKER }
         - { path: ^/unblockingUser, roles: ROLE_USER_BLOCKER }

        # Moderator
         - { path: ^/article/moderation/publish, roles: ROLE_ARTICLE_APPROVER }
         - { path: ^/article/moderation/reject, roles: ROLE_ARTICLE_APPROVER }
         - { path: ^/article/moderation, roles: ROLE_ARTICLE_APPROVER }

        # Authorized
         - { path: ^/deleteAccount, roles: ROLE_USER }
         - { path: ^/notifications, roles: ROLE_USER }
         - { path: ^/article/add, roles: ROLE_USER }
         - { path: ^/bookmarks, roles: ROLE_USER }
         - { path: ^/settings, roles: ROLE_USER }
         - { path: ^/reset, roles: ROLE_USER }
         - { path: ^/edit, roles: ROLE_USER }
