vich_uploader:
    db_driver: orm

    mappings:
        people_images:
            uri_prefix: /uploads/images/people
            upload_destination: '%kernel.project_dir%/public/uploads/images/people'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        genre_images:
            uri_prefix: /uploads/images/genre
            upload_destination: '%kernel.project_dir%/public/uploads/images/genre'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        theme_images:
            uri_prefix: /uploads/images/theme
            upload_destination: '%kernel.project_dir%/public/uploads/images/theme'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        artist_musics:
            uri_prefix: /uploads/audio/music
            upload_destination: '%kernel.project_dir%/public/uploads/audio/music'
            namer:
                service: Vich\UploaderBundle\Naming\PropertyNamer
                options: { property: 'slug'}

        user_avatars:
            uri_prefix: /uploads/images/avatars
            upload_destination: '%kernel.project_dir%/public/uploads/images/avatars'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        post_images:
            uri_prefix: /uploads/images/posts
            upload_destination: '%kernel.project_dir%/public/uploads/images/posts'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
